<!doctype html> <!-- Tells the browser this is a modern HTML5 page -->
<html lang="en"> <!-- Start of the page; the content is in English -->
  <head> <!-- The head holds settings about the page, not visible content -->
    <meta charset="UTF-8" /> <!-- Use UTF-8 text encoding so all characters (å, ø, é...) display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Make the page fit phone screens instead of shrinking a desktop layout -->
    <title>Landturn</title> <!-- The name shown in the browser tab -->
  </head> <!-- End of the head -->
  <body> <!-- The body holds everything you see on the page -->
    <form id="search" class="search"> <!-- The search form; its id lets our JavaScript find it later -->
      <input id="address" type="text" placeholder="Enter any address" aria-label="Address" /> <!-- The text box; the placeholder is the grey hint text, and aria-label names it for screen readers -->
      <button type="submit">Show changes</button> <!-- The button; "submit" means clicking it (or pressing Enter) sends the form -->
    </form> <!-- End of the search form -->
    <p id="search-message" class="search-message" hidden></p> <!-- An empty message area under the search box; "hidden" keeps it invisible until there's something to say -->
    <div id="cover" class="cover" aria-live="polite">Loading imagery…</div> <!-- Dark cover shown while the map moves; aria-live makes screen readers announce it -->
    <div id="map"></div> <!-- An empty box with the id "map"; MapLibre will draw the map inside it -->
    <script type="module" src="/src/main.js"></script> <!-- Load our JavaScript; "module" lets it use import statements -->
  </body> <!-- End of the visible content -->
</html> <!-- End of the page -->
