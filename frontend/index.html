<!doctype html> <!-- Tells the browser this is a modern HTML5 page -->
<html lang="en"> <!-- Start of the page; the content is in English -->
  <head> <!-- The head holds settings about the page, not visible content -->
    <meta charset="UTF-8" /> <!-- Use UTF-8 text encoding so all characters (å, ø, é...) display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Make the page fit phone screens instead of shrinking a desktop layout -->
    <title>Landturn</title> <!-- The name shown in the browser tab -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Start connecting to Google Fonts early, so the fonts arrive sooner -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- Same for the server that holds the actual font files -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /> <!-- Load the two mockup fonts; "display=swap" shows a standard font until they arrive -->
  </head> <!-- End of the head -->
  <body> <!-- The body holds everything you see on the page -->
    <div class="app"> <!-- The whole app: the globe area and the text panel side by side (or stacked on phones) -->
      <div class="stage"> <!-- The big picture area where the globe is drawn -->
        <canvas id="globe" class="globe" role="img" aria-label="Globe of the Earth"></canvas> <!-- A drawing surface; globe.js paints the Earth on it. role/aria-label describe it for screen readers -->
        <div id="teaser" class="teaser" hidden><strong></strong><small></small></div> <!-- The hover box for hotspots; globe.js fills in the name and teaser, and shows it -->

      </div> <!-- End of the stage -->
      <section class="panel"> <!-- The text panel: left side on computers, bottom on phones -->
        <p class="kicker">LANDTURN · SHEET 00 · WORLD</p> <!-- Small label above the headline, styled like a drawing sheet number -->
        <h1>Every place on Earth has turned.</h1> <!-- The main headline -->
        <p class="lede">Enter any address to see how its land changed since 2017: what was built, what was cleared, what went under water.</p> <!-- The intro text ("lede" is a newspaper word for the opening lines) -->
        <form id="search" class="search"> <!-- The search form; its id lets main.js find it -->
          <input id="address" type="text" placeholder="Enter any address" aria-label="Address" autocomplete="off" /> <!-- The text box; autocomplete="off" stops the browser's own suggestion list covering the panel -->
          <button type="submit">Show change</button> <!-- The button; clicking it or pressing Enter sends the form -->
        </form> <!-- End of the search form -->
        <p id="search-message" class="message" role="status" hidden></p> <!-- Messages like "Couldn't find that address"; role="status" makes screen readers announce them -->
        <p class="kicker">OR START WITH A PLACE THAT TURNED</p> <!-- Label above the place buttons -->
        <div id="places" class="places"></div> <!-- Empty area; main.js adds one button per place here -->
      </section> <!-- End of the panel -->
    </div> <!-- End of the app -->
    <script type="module" src="/src/main.js"></script> <!-- Load our JavaScript; "module" lets it use import statements -->
  </body> <!-- End of the visible content -->
</html> <!-- End of the page -->
